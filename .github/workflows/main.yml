name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Permanent Keystore
        run: |
          mkdir -p app
          keytool -genkey -v -keystore app/salman_food.jks \
            -alias salmanfood \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "SalmanFood@2026" -keypass "SalmanFood@2026" \
            -dname "CN=SalmanFood, OU=App, O=SalmanFood, L=City, S=State, C=IN"

      - name: Disable Google Services Plugin Check
        run: |
          sed -i '/com.google.gms.google-services/d' app/build.gradle.kts 2>/dev/null || true
          sed -i '/com.google.gms.google-services/d' build.gradle.kts 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: ./gradlew assembleDebug -x processDebugGoogleServices --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SalmanFood-APK
          path: "**/build/outputs/apk/**/*.apk"
          
