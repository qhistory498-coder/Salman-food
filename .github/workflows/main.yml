name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Fixed Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -startdate "2024/01/01 00:00:00"
          cp ~/.android/debug.keystore debug.keystore 2>/dev/null || true
          cp ~/.android/debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Disable Google Services Plugin Check
        run: |
          sed -i '/com.google.gms.google-services/d' app/build.gradle.kts 2>/dev/null || true
          sed -i '/com.google.gms.google-services/d' build.gradle.kts 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Auto Version
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} -x processDebugGoogleServices

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SalmanFood-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
